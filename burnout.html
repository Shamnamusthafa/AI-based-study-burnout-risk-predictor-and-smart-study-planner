<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Burnout Risk Predictor</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;

            background: #4f46e5;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;

            background: #eef2ff;
            border-radius: 8px;

            text-align: center;
        }

        .back {
            display: inline-block;
            margin-top: 20px;

            padding: 12px 20px;

            background: #4f46e5;
            color: white;

            text-decoration: none;
            border-radius: 6px;
        }

    </style>

</head>

<body>


    <div class="navbar">

        <h1>🔥 Burnout Risk Predictor</h1>

    </div>


    <div class="container">

        <div class="card">


            <form action="/burnout" method="POST">


                <label>
                    Study Hours
                </label>

                <input
                    type="number"
                    name="study_hours"
                    min="0"
                    required
                >


                <label>
                    Sleep Hours
                </label>

                <input
                    type="number"
                    name="sleep_hours"
                    min="0"
                    required
                >


                <label>
                    Breaks Per Day
                </label>

                <input
                    type="number"
                    name="breaks"
                    min="0"
                    required
                >


                <label>
                    Stress Level (1-10)
                </label>

                <input
                    type="number"
                    name="stress_level"
                    min="1"
                    max="10"
                    required
                >


                <label>
                    Number of Tasks
                </label>

                <input
                    type="number"
                    name="tasks"
                    min="0"
                    required
                >


                <button type="submit">
                    Check Burnout Risk
                </button>

            </form>


            {% if result %}

            <div class="result">

                <h2>
                    Your Burnout Risk
                </h2>

                <h1>
                    {{ result }}
                </h1>

            </div>

            {% endif %}


            <a href="/" class="back">
                🏠 Back to Home
            </a>


        </div>

    </div>

</body>

</html>
