<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Study Plan</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #4f46e5;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;

            background: #4f46e5;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        .plan {
            background: #eef2ff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .back {
            display: inline-block;
            padding: 12px 20px;

            background: #4f46e5;
            color: white;

            text-decoration: none;
            border-radius: 6px;
        }

    </style>

</head>

<body>


    <div class="navbar">

        <h1>📚 Create Your Study Plan</h1>

    </div>


    <div class="container">


        <!-- FORM -->

        <div class="card">

            <h2>📅 Study Plan Generator</h2>

            <form action="/planner" method="POST">


                <label>
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    placeholder="Example: Python"
                    required
                >


                <label>
                    Study Hours Per Day
                </label>

                <input
                    type="number"
                    name="hours"
                    min="1"
                    max="24"
                    placeholder="Example: 4"
                    required
                >


                <label>
                    Number of Days
                </label>

                <input
                    type="number"
                    name="days"
                    min="1"
                    max="365"
                    placeholder="Example: 7"
                    required
                >


                <button type="submit">
                    Generate Study Plan
                </button>

            </form>

        </div>


        <!-- GENERATED PLAN -->

        {% if plan %}

        <div class="card">

            <h2>📖 Your Study Plan</h2>

            {% for day in plan %}

            <div class="plan">

                <h3>
                    Day {{ day.day }}
                </h3>

                <p>
                    📘 {{ day.session1 }}
                </p>

                <p>
                    📗 {{ day.session2 }}
                </p>

            </div>

            {% endfor %}

        </div>

        {% endif %}


        <a href="/" class="back">
            🏠 Back to Home
        </a>


    </div>

</body>

</html>
